---
name: Deploy

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string

concurrency:
    group: deploy
    cancel-in-progress: true

permissions: {}

jobs:

    deploy:
      name: Deploy staging
      runs-on: self-hosted-hoprnet-small
      permissions:
        contents: read
        id-token: write # GCP workload identity federation
      steps:
        - name: Checkout repository
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            ref: ${{ inputs.branch }}
            persist-credentials: false

        - name: Setup GCP
          id: gcp
          uses: hoprnet/hopr-workflows/actions/setup-gcp@2ca6e5b55819505e4e304ed3b0ff62da01cc7c0e # setup-gcp-v4.0.3
          with:
            login_gke: 'true'

        - name: "Restart deployment"
          run: |
              echo "[INFO] Restarting degen deployment"
              kubectl rollout restart deployments -n uhttp availability-monitor discovery-platform
              kubectl rollout status -w deployments -n uhttp availability-monitor discovery-platform