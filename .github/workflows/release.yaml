name: Close release

on:
    workflow_dispatch:
        inputs:
            release_type:
                description: 'Next version type'
                required: true
                type: choice
                default: 'patch'
                options:
                    - patch
                    - minor
                    - major
            project:
                description: 'Project'
                required: true
                type: choice
                options:
                    - discovery-platform
                    - rpc-server
                    - availability-monitor

concurrency:
    group: release
    cancel-in-progress: false

permissions: {}

jobs:
    release:
        name: Close release
        runs-on: self-hosted-hoprnet-small
        permissions:
            contents: write # GitHub release; the version bump push uses GH_RUNNER_TOKEN
            id-token: write # GCP workload identity federation

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                ref: main # if you want to use a different branch keep in mind that the bump version step will be affected
                token: "${{ secrets.GH_RUNNER_TOKEN }}"

            - name: Setup Node.js
              uses: hoprnet/hopr-workflows/actions/setup-node-js@15db9fb5571957317b77567abef997b1554f2fbb # setup-node-js-v1.0.0
              with:
                  node_version: ${{ vars.NODE_VERSION }}

            - name: Setup GCP
              id: gcp
              uses: hoprnet/hopr-workflows/actions/setup-gcp@2ca6e5b55819505e4e304ed3b0ff62da01cc7c0e # setup-gcp-v4.0.3
              with:
                  login_artifact_registry: 'true'

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
              with:
                  driver: kubernetes

            - name: Building
              run: yarn build

            - name: Linting
              run: yarn lint:ci

            - name: Formatting
              run: yarn format:ci

            - name: Testing
              run: yarn test

            - name: Setup environment variables
              id: environment
              env:
                  PROJECT: ${{ inputs.project }}
              run: |
                  PACKAGE_VERSION=$(jq -r '.version' "apps/${PROJECT}/package.json")
                  echo "release_version=${PACKAGE_VERSION}" >> $GITHUB_OUTPUT

            - name: Create Release
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
              with:
                  name: '${{ inputs.project }} - v${{ steps.environment.outputs.release_version }}'
                  tag_name: v${{ steps.environment.outputs.release_version }}

            - name: Build and push docker image
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
              with:
                  push: true
                  file: "./apps/${{ inputs.project }}/Dockerfile"
                  tags: ${{ vars.DOCKER_IMAGE_REGISTRY }}/${{ inputs.project }}:${{ steps.environment.outputs.release_version }}
                  cache-from: type=gha,scope=release-${{ inputs.project }}
                  cache-to: type=gha,mode=max,scope=release-${{ inputs.project }},ignore-error=true

            - name: Bump Version
              id: bump
              env:
                  RELEASE_TYPE: ${{ inputs.release_type }}
                  PROJECT: ${{ inputs.project }}
              run: |
                  npm version "${RELEASE_TYPE}" -w "apps/${PROJECT}" --no-git-tag-version
                  BUMP_VERSION=$(jq -r '.version' "apps/${PROJECT}/package.json")
                  echo "bump_version=${BUMP_VERSION}" >> $GITHUB_OUTPUT

            - uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9.1.4
              with:
                add: 'apps/${{ inputs.project}}'
                new_branch: main
                message: 'Bump ${{ inputs.project }} version to ${{ steps.bump.outputs.bump_version }}'
                pathspec_error_handling: exitImmediately

            - name: Notify new release
              uses: zulip/github-actions-zulip/send-message@f675f2b4eb2a95fae974215476dcb7ad8dfeff6b # v2.0.2
              with:
                  api-key: ${{ secrets.ZULIP_API_KEY }}
                  email: ${{ secrets.ZULIP_EMAIL }}
                  organization-url: 'https://hopr.zulipchat.com'
                  type: 'stream'
                  to: 'Releases'
                  topic: 'main'
                  content: |
                      I'm thrilled to inform the new **${{ vars.DOCKER_IMAGE_NAME }}** version **${{ steps.environment.outputs.release_version }}** has been released.
