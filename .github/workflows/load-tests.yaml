---
#################################################################################
# Manual pipeline to start a load testing scenario
#################################################################################
name: Load Tests

on:
# Starts at 2:00 AM CET
  # schedule:
  #   - cron: '00 2 * * *'
  workflow_dispatch:
    inputs:
      test_id:
        type: string
        required: true
        description: 'Test name'
      test_type:
        type: choice
        options:
          - SMOKE
          - SOAK
          - SPIKE
          - STRESS
          - LOAD
          - BURST
          - CONSTANT
          - LONG
        required: true
        description: 'Test type'
      wallet_type:
        type: choice
        options:
          - METAMASK
          - DUMMY
          - OKX
          - RABBY
          - FRAME
        required: true
        description: 'Wallet Type'

concurrency:
  group: load-tests
  cancel-in-progress: true

permissions: {}

jobs:

  load-tests:
    name: Load Tests
    runs-on: self-hosted
    permissions:
      contents: read
    steps:

      - name: Checkout hoprnet repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'


      - name: Set up Google Cloud Credentials
        uses: google-github-actions/auth@3a3c4c57d294ef65efaaee4ff17b22fa88dd3c69 # v1.3.0
        with:
          token_format: "access_token"
          credentials_json: ${{ secrets.GCP_SA_GITHUB_RUNNER }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: hopr-staging
          install_components: beta

      - name: Get credentials
        uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          cluster_name: cluster-staging
          location: europe-west3
          project_id: hopr-staging

      - name: Setup NodeJs
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: 20

      - name: Run Load test
        env:
          TEST_TYPE: ${{ inputs.test_type }}
          WALLET_TYPE: ${{ inputs.wallet_type }}
          TEST_ID: ${{ inputs.test_id }}
        shell: bash
        run: |
          for v in "$TEST_TYPE" "$WALLET_TYPE" "$TEST_ID"; do
            if ! [[ "$v" =~ ^[0-9A-Za-z._-]+$ ]]; then
              echo "::error::Invalid input value" >&2
              exit 1
            fi
          done
          pip install -r requirements.txt
          jinja2 --format=yaml k6.yaml.j2 -D testType="$TEST_TYPE" -D walletType="$WALLET_TYPE" -D testId="$TEST_ID" > k6.yaml
          kubectl delete -f k6.yaml 2> /dev/null || true
          kubectl apply -f k6.yaml
        working-directory: "./devkit/loadtesting-k6"
