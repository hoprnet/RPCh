name: Merge PR

on:
    pull_request:
        types:
            - closed
        branches:
            - main

concurrency:
    group: merge
    cancel-in-progress: false

permissions: {}

jobs:
    merge:
        name: Merge PR
        runs-on: ubuntu-latest
        if: github.event.pull_request.merged == true
        permissions:
            contents: read
            id-token: write # GCP workload identity federation
        strategy:
          matrix:
            project:
              - discovery-platform
              - rpc-server
              - availability-monitor

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup GCP
              id: gcp
              uses: hoprnet/hopr-workflows/actions/setup-gcp@2ca6e5b55819505e4e304ed3b0ff62da01cc7c0e # setup-gcp-v4.0.3
              with:
                  login_artifact_registry: 'true'

            # - name: Set up Docker Buildx
            #   uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
            #   with:
            #       driver: kubernetes

            - name: Build and push docker image
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
              with:
                  push: true
                  file: "./apps/${{ matrix.project }}/Dockerfile"
                  tags: |
                    ${{ vars.DOCKER_IMAGE_REGISTRY }}/${{ matrix.project }}:staging
                    ${{ vars.DOCKER_IMAGE_REGISTRY }}/${{ matrix.project }}:latest

    deploy:
      name: Deploy staging
      needs: merge
      uses: ./.github/workflows/deploy.yaml
      permissions:
        contents: read
        id-token: write # GCP workload identity federation
      with:
        branch: ${{ github.event.pull_request.head.ref }}