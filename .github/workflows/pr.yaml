---
name: Build

on:
    pull_request:
        types: 
          - opened
          - synchronize
          - reopened
          - labeled

concurrency:
    group: ${{ github.event.pull_request.number || github.ref }}-build
    cancel-in-progress: true

permissions: {}

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                persist-credentials: false

            - name: Setup Node.js
              uses: hoprnet/hopr-workflows/actions/setup-node-js@15db9fb5571957317b77567abef997b1554f2fbb # setup-node-js-v1.0.0
              with:
                  node_version: 20.x

            - name: Linting
              run: yarn lint:ci

            - name: Formatting
              run: yarn format:ci

            - name: Review dependencies
              # TODO: update ethers to v6 in RPCh SDK to remove the ignore-path
              run: yarn depcheck --ignore-path="examples"

    build:
        name: Build
        runs-on: ubuntu-latest # Cannot use self hosted runners because of running postgres docker container
        permissions:
            contents: read
        strategy:
            matrix:
                node-version: [20.x, 22.x]

        services:
          # required by unit tests
          postgres:
            image: postgres
            env:
              POSTGRES_USER: postgres
              POSTGRES_PASSWORD: postgres
              POSTGRES_DB: postgres
            # set health checks to wait until postgres has started
            options: >-
              --health-cmd pg_isready
              --health-interval 10s
              --health-timeout 5s
              --health-retries 5
            ports:
              - 5432:5432

        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                persist-credentials: false

            - name: Setup Node.js
              uses: hoprnet/hopr-workflows/actions/setup-node-js@15db9fb5571957317b77567abef997b1554f2fbb # setup-node-js-v1.0.0
              with:
                  node_version: ${{ matrix.node-version }}

            - name: Building
              run: yarn build

            - name: Testing
              run: yarn test
              env:
                PGHOST: localhost
                PGPORT: 5432
                PGUSER: postgres
                PGDATABASE: postgres
                PGPASSWORD: postgres

            # - name: Run E2E tests
            #   run: yarn test:e2e

    publish:
        name: Publish
        runs-on: ubuntu-latest
        needs: [lint, build]
        permissions:
            contents: read
            id-token: write # GCP workload identity federation
        strategy:
          matrix:
            project:
              - discovery-platform
              - rpc-server
              - availability-monitor
        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                persist-credentials: false

            - name: Setup GCP
              id: gcp
              uses: hoprnet/hopr-workflows/actions/setup-gcp@2ca6e5b55819505e4e304ed3b0ff62da01cc7c0e # setup-gcp-v4.0.3
              with:
                  login_artifact_registry: 'true'
                  install_sdk: 'true'

            # - name: Set up Docker Buildx
            #   uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
            #   with:
            #       driver: kubernetes

            - name: Get PR version
              id: variables
              env:
                  PROJECT: ${{ matrix.project }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  PR_VERSION=$(jq -r '.version' apps/"${PROJECT}"/package.json)-pr."${PR_NUMBER}"
                  echo "PR_VERSION=${PR_VERSION}" >> $GITHUB_OUTPUT

            - name: Build and push docker image
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
              with:
                  push: true
                  file: "./apps/${{ matrix.project }}/Dockerfile"
                  tags: ${{ vars.DOCKER_IMAGE_REGISTRY }}/${{ matrix.project }}:${{ steps.variables.outputs.PR_VERSION }}

            - name: Tag staging
              if: contains(github.event.pull_request.labels.*.name, 'deploy_staging') || github.event.label.name == 'deploy_staging' && github.event.action == 'labeled'
              env:
                  REGISTRY: ${{ vars.DOCKER_IMAGE_REGISTRY }}
                  PROJECT: ${{ matrix.project }}
                  PR_VERSION: ${{ steps.variables.outputs.PR_VERSION }}
              run: |
                gcloud artifacts docker tags add "${REGISTRY}/${PROJECT}:${PR_VERSION}" "${REGISTRY}/${PROJECT}:staging"

    deploy:
      name: Deploy
      needs: publish
      if: contains(github.event.pull_request.labels.*.name, 'deploy_staging') || github.event.label.name == 'deploy_staging' && github.event.action == 'labeled'
      uses: ./.github/workflows/deploy.yaml
      permissions:
        contents: read
        id-token: write # GCP workload identity federation
      with:
        branch: ${{ github.event.pull_request.head.ref }}

    # Intended as the single required check for the branch ruleset; making it required is a follow-up (hoprnet/hopr-devops#372).
    merge-gate:
      name: Merge gate
      if: always()
      needs: [lint, build, publish, deploy]
      runs-on: ubuntu-latest
      permissions: {}
      steps:
        - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
          with:
            # `deploy` may skip only while the `deploy_staging` label is absent.
            allowed-skips: ${{ !(contains(github.event.pull_request.labels.*.name, 'deploy_staging') || github.event.label.name == 'deploy_staging' && github.event.action == 'labeled') && 'deploy' || '' }}
            jobs: ${{ toJSON(needs) }}
