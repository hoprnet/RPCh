---
name: Build

on:
    pull_request:
        types: 
          - opened
          - synchronize
          - reopened
          - labeled

concurrency:
    group: build
    cancel-in-progress: true

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest # Cannot use self hosted runners because of running postgres docker container
        strategy:
            matrix:
                node-version: [18.x, 20.x, 22.x]

        services:
          # required by unit tests
          postgres:
            image: postgres
            env:
              POSTGRES_USER: postgres
              POSTGRES_PASSWORD: postgres
              POSTGRES_DB: postgres
            # set health checks to wait until postgres has started
            options: >-
              --health-cmd pg_isready
              --health-interval 10s
              --health-timeout 5s
              --health-retries 5
            ports:
              - 5432:5432

        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup Node.js
              uses: hoprnet/hopr-workflows/actions/setup-node-js@15db9fb5571957317b77567abef997b1554f2fbb # setup-node-js-v1.0.0
              with:
                  node_version: ${{ matrix.node-version }}

            - name: Building
              run: yarn build

            - name: Linting
              run: yarn lint:ci

            - name: Formatting
              run: yarn format:ci

            - name: Review dependencies
              # TODO: update ethers to v6 in RPCh SDK to remove the ignore-path
              run: yarn depcheck --ignore-path="examples"

            - name: Testing
              run: yarn test
              env:
                PGHOST: localhost
                PGPORT: 5432
                PGUSER: postgres
                PGDATABASE: postgres
                PGPASSWORD: postgres

            # - name: Run E2E tests
            #   run: yarn test:e2e

    publish:
        name: Publish
        runs-on: ubuntu-latest
        needs: build
        strategy:
          matrix:
            project:
              - discovery-platform
              - rpc-server
              - availability-monitor
        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup GCP
              id: gcp
              uses: hoprnet/hopr-workflows/actions/setup-gcp@2ca6e5b55819505e4e304ed3b0ff62da01cc7c0e # setup-gcp-v4.0.3
              with:
                  login_artifact_registry: 'true'
                  install_sdk: 'true'

            # - name: Set up Docker Buildx
            #   uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
            #   with:
            #       driver: kubernetes

            - name: Get PR version
              id: variables
              run: |
                  PR_VERSION=$(jq -r '.version' apps/"${{ matrix.project }}"/package.json)-pr."${{ github.event.pull_request.number }}"
                  echo "PR_VERSION=${PR_VERSION}" >> $GITHUB_OUTPUT

            - name: Build and push docker image
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
              with:
                  push: true
                  file: "./apps/${{ matrix.project }}/Dockerfile"
                  tags: ${{ vars.DOCKER_IMAGE_REGISTRY }}/${{ matrix.project }}:${{ steps.variables.outputs.PR_VERSION }}

            - name: Tag staging
              if: contains(github.event.pull_request.labels.*.name, 'deploy_staging') || github.event.label.name == 'deploy_staging' && github.event.action == 'labeled'
              run: |
                gcloud artifacts docker tags add ${{ vars.DOCKER_IMAGE_REGISTRY }}/${{ matrix.project }}:${{ steps.variables.outputs.PR_VERSION }} ${{ vars.DOCKER_IMAGE_REGISTRY }}/${{ matrix.project }}:staging

    deploy:
      name: Deploy
      needs: publish
      if: contains(github.event.pull_request.labels.*.name, 'deploy_staging') || github.event.label.name == 'deploy_staging' && github.event.action == 'labeled'
      uses: ./.github/workflows/deploy.yaml
      with:
        branch: ${{ github.event.pull_request.head.ref }}
      secrets: inherit